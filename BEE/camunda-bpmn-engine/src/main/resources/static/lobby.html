<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a team</title>
  <style>
    body {
      margin: 0; font-family: "Segoe UI", Tahoma, sans-serif; color: #13213a;
      background: #eef2f8;
    }
    .sheet { max-width: 720px; margin: 0 auto; padding: 28px 18px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.lead { color: #55637d; margin: 0 0 20px; font-size: 14px; }

    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 13px; color: #55637d; margin-bottom: 4px; }
    select {
      font-family: inherit; font-size: 15px; padding: 10px 12px; width: 100%;
      box-sizing: border-box; border: 1px solid #c3cfe3; border-radius: 6px;
      background: #fff;
    }

    button {
      font-family: inherit; font-size: 15px; cursor: pointer;
      border: 1px solid #c3cfe3; border-radius: 6px; background: #fff;
      padding: 10px 14px; width: 100%;
    }
    button:disabled { cursor: default; opacity: .5; }
    button.primary { background: #2f6fd0; border-color: #2f6fd0; color: #fff; }
    button.quiet { background: #fff; color: #8f2222; border-color: #e3b8b8; }
    button.leave { background: #fdecea; color: #8f2222; border-color: #b42318; }

    .teams { display: flex; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
    .team {
      flex: 1 1 260px; border: 2px solid #c3cfe3; border-radius: 8px; padding: 14px;
      background: #fff;
    }
    .team.team1 { border-color: #2f6fd0; background: #f6f9fe; }
    .team.team2 { border-color: #d03b3b; background: #fef7f7; }
    .team h2 { margin: 0 0 2px; font-size: 16px; }
    .team.team1 h2 { color: #1d4a8f; }
    .team.team2 h2 { color: #8f2222; }
    .team .count { font-size: 13px; color: #55637d; margin-bottom: 10px; }
    .team ul { list-style: none; padding: 0; margin: 0 0 12px; font-size: 14px; min-height: 24px; }
    .team li { padding: 3px 0; }
    .team li.me { font-weight: 600; }
    .team li .pool { color: #55637d; font-size: 12px; }

    .aside { font-size: 14px; color: #55637d; margin-bottom: 14px; }
    .notice { font-size: 14px; margin-top: 12px; min-height: 20px; }
    .notice.bad { color: #b42318; }
    .notice.good { color: #0a7f3f; }
    .row { display: flex; gap: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="sheet">
    <h1>Choose a team</h1>
    <p class="lead" id="who"></p>

    <div class="teams">
      <div class="team team1">
        <h2>Team 1</h2>
        <div class="count" id="team1Count"></div>
        <ul id="team1List"></ul>
        <button id="joinTeam1">Join team 1</button>
      </div>
      <div class="team team2">
        <h2>Team 2</h2>
        <div class="count" id="team2Count"></div>
        <ul id="team2List"></ul>
        <button id="joinTeam2">Join team 2</button>
      </div>
    </div>

    <div class="aside" id="sittingOut"></div>

    <button class="primary" id="startButton" disabled>Start the match</button>
    <div class="notice" id="notice"></div>
  </div>

  <script src="config.js"></script>
  <script>
    const PARTICIPANTS_API = '/api/environment/participants';
    const ENGINE_API = '/engine-rest';

    const REFRESH_MS = 2000;

    const OWNER_LABEL = { team1: 'Team 1', team2: 'Team 2' };

    let me = JSON.parse(sessionStorage.getItem('player') || 'null');
    if (!me) {
      location.replace('login.html');
    }

    const isAdmin = me !== null && me.role === 'admin';

    const startButton = document.getElementById('startButton');
    const notice = document.getElementById('notice');
    const button1 = document.getElementById('joinTeam1');
    const button2 = document.getElementById('joinTeam2');

    const POOL_NAMES = {
      team1: ['Player1 Team1', 'Player2 Team1'],
      team2: ['Player1 Team2', 'Player2 Team2'],
    };
    const PLAYERS_PER_TEAM = 2;

    async function getJson(url) {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error(url + ' answered ' + response.status);
      return response.json();
    }

    async function getBeeData(url) {
      const body = await getJson(url);
      if (!body.success) throw new Error(body.message || 'BEE refused ' + url);
      return body.data;
    }

    /** Reads the message a Spring error carries, or falls back to the code. */
    async function problemOf(response) {
      const body = await response.json().catch(() => null);
      if (body && body.error) return body.error;
      return 'status ' + response.status;
    }

    function remember(player) {
      me = player;
      sessionStorage.setItem('player', JSON.stringify(player));
    }

    function setNotice(message, kind) {
      notice.textContent = message;
      notice.className = 'notice ' + (kind || '');
    }

    // ----- TEAM PICKING -----

    /** Redraws the lobby from what the other players have chosen. */
    async function refresh() {
      let players;
      try {
        players = await getJson(`${GAME_API}/api/players/getAllPlayers`);
      } catch (error) {
        setNotice('Cannot reach the game: ' + error.message, 'bad');
        return;
      }

      const mine = players.find((player) => player.id === me.id);
      if (mine) {
        remember(mine);
      } else {
        sessionStorage.clear();
        location.replace('login.html');
        return;
      }

      drawTeams(players);

      if (await matchIsRunning()) {
        if (isAdmin) {
          startButton.disabled = true;
          setNotice('The match is running.', 'good');
        } else if (me.team && me.beeParticipantId) {
          location.replace('game.html');
        } else {
          startButton.disabled = true;
          setNotice('The match has started without you. Wait for the next one.', '');
        }
      }
    }

    /** Draws the two rosters and decides what the buttons may do. */
    function drawTeams(players) {
      const team1 = players.filter((player) => player.team === 'team1');
      const team2 = players.filter((player) => player.team === 'team2');
      const sittingOut = players.filter((player) => !player.team && player.role !== 'admin');

      fillRoster('team1List', team1);
      fillRoster('team2List', team2);
      document.getElementById('team1Count').textContent = team1.length + ' player(s)';
      document.getElementById('team2Count').textContent = team2.length + ' player(s)';

      document.getElementById('sittingOut').textContent = sittingOut.length === 0
        ? 'Everybody has chosen a team.'
        : 'Sitting this one out: ' + sittingOut.map((player) => player.nickname).join(', ');

      const others1 = team1.filter((player) => player.id !== me.id).length;
      const others2 = team2.filter((player) => player.id !== me.id).length;

      paintTeamButton(button1, 'team1', 'Join team 1', others1 + 1 - others2 > 1 || others1 >= PLAYERS_PER_TEAM);
      paintTeamButton(button2, 'team2', 'Join team 2', others2 + 1 - others1 > 1 || others2 >= PLAYERS_PER_TEAM);

      if (isAdmin) {
        button1.style.display = 'none';
        button2.style.display = 'none';
      }

      const playing = team1.concat(team2);
      const balanced = Math.abs(team1.length - team2.length) <= 1;
      const enoughPlayers = playing.length >= 2;
      const roomForEverybody = team1.length <= PLAYERS_PER_TEAM && team2.length <= PLAYERS_PER_TEAM;

      startButton.disabled = !(balanced && enoughPlayers && roomForEverybody);

      if (!enoughPlayers) {
        setNotice('At least two players have to pick a side.', '');
      } else if (!balanced) {
        setNotice('The teams are not level yet.', 'bad');
      } else if (!roomForEverybody) {
        setNotice('A team can hold at most ' + PLAYERS_PER_TEAM + ' players.', 'bad');
      } else if (!me.team && !isAdmin) {
        setNotice('Ready to start, but you are not going to play this match.', '');
      } else {
        setNotice('Ready to start.', 'good');
      }
    }

    function fillRoster(elementId, players) {
      const list = document.getElementById(elementId);
      list.innerHTML = '';
      for (const player of players) {
        const item = document.createElement('li');
        if (player.id === me.id) item.className = 'me';
        item.textContent = player.nickname;
        if (player.beeParticipantId) {
          const pool = document.createElement('span');
          pool.className = 'pool';
          pool.textContent = ' - ' + player.beeParticipantId;
          item.appendChild(pool);
        }
        list.appendChild(item);
      }
    }

    // ----- BUTTONS ACTIONS -----

    async function joinTeam(team) {
      try {
        const response = await fetch(
          `${GAME_API}/api/players/updatePlayerTeam/${me.id}?team=${team}`,
          { method: 'PUT' });
        if (!response.ok) throw new Error(await problemOf(response));
        remember(await response.json());
        refresh();
      } catch (error) {
        setNotice(error.message, 'bad');
      }
    }

    /** Leaves the match being set up. */
    async function leaveTeam() {
      try {
        const response = await fetch(
          `${GAME_API}/api/players/leaveMatch/${me.id}`, { method: 'PUT' });
        if (!response.ok) throw new Error(await problemOf(response));

        remember(await response.json());
        refresh();
      } catch (error) {
        setNotice(error.message, 'bad');
      }
    }

    function paintTeamButton(button, team, joinText, tooManyPlayers) {
      const inside = me.team === team;
      button.textContent = inside ? 'Leave the team' : joinText;
      button.className = inside ? 'leave' : '';
      button.disabled = !inside && (Boolean(me.team) || tooManyPlayers);
    }

    button1.addEventListener('click',
      () => (me.team === 'team1' ? leaveTeam() : joinTeam('team1')));
    button2.addEventListener('click',
      () => (me.team === 'team2' ? leaveTeam() : joinTeam('team2')));

    // ----- MATCH PREPARATION -----

    /** Says whether a match is being played. */
    async function matchIsRunning() {
      try {
        const match = await getJson(`${GAME_API}/api/match/state`);
        return match.started;
      } catch (error) {
        return false;
      }
    }

    /** Reads which process belongs to which pool. */
    async function processByParticipant() {
      const definitions = await getJson(`${ENGINE_API}/process-definition?latestVersion=true`);
      if (!definitions.length) {
        throw new Error('no process is deployed');
      }

      const answer = await getJson(
        `${ENGINE_API}/process-definition/${definitions[0].id}/xml`);
      const bpmn = new DOMParser().parseFromString(answer.bpmn20Xml, 'text/xml');

      const pairing = new Map();
      const pools = Array.from(bpmn.getElementsByTagNameNS('*', 'participant'));
      for (const participant of pools) {
        const processRef = participant.getAttribute('processRef');
        if (processRef) {
          pairing.set(participant.getAttribute('id'), processRef);
        }
      }
      return pairing;
    }

    /** Assigns a pool to every player of a team. */
    async function assignPools(players) {
      const participants = await getBeeData(PARTICIPANTS_API);

      /* The pools are looked up by name, the way they are written in the process. */
      const poolsByName = new Map();
      for (const participant of participants) {
        const name = String(participant.name || participant.id).toLowerCase();
        poolsByName.set(name, participant);
      }

      /* Old pools are freed first, so nobody keeps a pool from the previous match. */
      for (const player of players) {
        if (player.beeParticipantId) {
          await linkPool(player, '');
        }
      }

      const playing = [];
      for (const team of ['team1', 'team2']) {
        const roster = players.filter((player) => player.team === team);
        if (roster.length > POOL_NAMES[team].length) {
          throw new Error(team + ' has more players than pools');
        }

        for (let index = 0; index < roster.length; index++) {
          const poolName = POOL_NAMES[team][index];
          const pool = poolsByName.get(poolName.toLowerCase());
          if (!pool) {
            throw new Error('the pool "' + poolName + '" is not in the deployed process');
          }
          playing.push(await linkPool(roster[index], pool.id));
        }
      }
      return playing;
    }

    /** Links a pool to the player or frees it when the id is empty. */
    async function linkPool(player, participantId) {
      const response = await fetch(
        `${GAME_API}/api/players/linkParticipant/${player.id}`
        + `?participantId=${encodeURIComponent(participantId)}`,
        { method: 'PUT' });
      if (!response.ok) throw new Error(await problemOf(response));

      const saved = await response.json();
      if (saved.id === me.id) remember(saved);
      return saved;
    }

    startButton.addEventListener('click', async () => {
      startButton.disabled = true;
      setNotice('Reading the deployed map...', '');

      try {
        const synced = await fetch(`${GAME_API}/api/outposts/syncWithEnvironment`,
          { method: 'POST' });
        if (!synced.ok) throw new Error(await problemOf(synced));

        setNotice('Assigning the pools...', '');
        const allPlayers = await getJson(`${GAME_API}/api/players/getAllPlayers`);
        const players = await assignPools(allPlayers);

        setNotice('Starting the match...', '');
        const pairing = await processByParticipant();

        let started = 0;
        for (const player of players) {
          if (!player.team || !player.beeParticipantId) continue;

          const processKey = pairing.get(player.beeParticipantId);
          if (!processKey) {
            throw new Error('the pool ' + player.beeParticipantId
              + ' is not in the deployed process');
          }

          const response = await fetch(
            `${ENGINE_API}/process-definition/key/${processKey}/start`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ businessKey: player.id }),
            });
          if (!response.ok) throw new Error(await problemOf(response));
          started++;
        }

        setNotice('Started ' + started + ' token(s).', 'good');
        if (!isAdmin) {
          location.replace('game.html');
        }
      } catch (error) {
        setNotice('Could not start: ' + error.message, 'bad');
        startButton.disabled = false;
      }
    });

    document.getElementById('who').textContent = 'Signed in as ' + me.nickname + '.';

    if (isAdmin) {
      document.querySelector('h1').textContent = 'Prepare the match';
      document.getElementById('who').textContent =
        'Signed in as ' + me.nickname + ' (administrator). You can start the match but not play it.';
    }
    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
