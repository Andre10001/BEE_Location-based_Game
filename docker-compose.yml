services:

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: unicamdb
      MYSQL_DATABASE: unicamLBG
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-punicamdb"]
      interval: 5s
      timeout: 5s
      retries: 30

  bee:
    build: ./BEE/camunda-bpmn-engine
    command:
      - "--app.envs-dir=/app/envs"
      - "--app.processes-dir=/app/processes"
    volumes:
      - ./BEE/camunda-bpmn-engine/src/main/resources/envs:/app/envs
      - ./BEE/camunda-bpmn-engine/src/main/resources/bpmn-processes:/app/processes:ro
    ports:
      - "8082:8082"
    restart: on-failure

  backend:
    build: ./location_based_game/backend
    command:
      - "--spring.datasource.url=jdbc:mysql://mysql:3306/unicamLBG?createDatabaseIfNotExist=true"
      - "--spring.datasource.username=root"
      - "--spring.datasource.password=unicamdb"
      - "--bee.base-url=http://bee:8082"
      - "--engine.base-url=http://bee:8082"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      bee:
        condition: service_started
    restart: on-failure

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    depends_on:
      - bee
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://proxy:80"]
    depends_on:
      - proxy
    restart: on-failure

volumes:
  mysql_data: